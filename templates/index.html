<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC Tools</title>
    <style>
        :root {
            --bg: #0f0f13;
            --card: #1e1e24;
            --primary: #00d2ff;
            --secondary: #ff0055;
            --text: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: gap;
            gap: 20px;
        }
        .card {
            background-color: var(--card);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload label {
            display: block;
            background: #2a2a35;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed #444;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-upload label:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-decode { background: var(--primary); color: #000; }
        .btn-encode { background: var(--secondary); color: #fff; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #444; cursor: not-allowed; }

        #progress-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .progress-box {
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--primary);
        }
        .bar-bg {
            background: #333;
            height: 10px;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s;
        }
        #status-text { font-size: 0.9rem; color: #ccc; }
        #percent-text { font-weight: bold; font-size: 1.5rem; margin-bottom: 10px; display: block;}

    </style>
</head>
<body>

    <h1>SC Tools</h1>

    <div class="container">
        <div class="card">
            <h2>🔓 DECODE (.sc / .sctx)</h2>
            <div class="file-upload">
                <label for="decode-file" id="label-decode">📂 Select file...</label>
                <input type="file" id="decode-file" onchange="updateLabel(this, 'label-decode')">
            </div>
            <button class="btn-decode" onclick="startProcess('decode')">Decode</button>
        </div>

        <div class="card">
            <h2>🔒 ENCODE (.zip)</h2>
            <div class="file-upload">
                <label for="encode-file" id="label-encode">📂 Select ZIP...</label>
                <input type="file" id="encode-file" accept=".zip" onchange="updateLabel(this, 'label-encode')">
            </div>
            <button class="btn-encode" onclick="startProcess('encode')">Encode & Download</button>
        </div>
    </div>

    <div id="progress-container">
        <div class="progress-box">
            <span id="percent-text">0%</span>
            <div class="bar-bg">
                <div class="bar-fill" id="bar-fill"></div>
            </div>
            <div id="status-text">Waiting...</div>
        </div>
    </div>

    <script>
        function updateLabel(input, labelId) {
            if (input.files && input.files.length > 0) {
                document.getElementById(labelId).innerText = "📄 " + input.files[0].name;
            }
        }

        function startProcess(type) {
            const inputId = type === 'decode' ? 'decode-file' : 'encode-file';
            const fileInput = document.getElementById(inputId);

            if (fileInput.files.length === 0) {
                alert("Select a file first!");
                return;
            }

            document.getElementById('progress-container').style.display = 'flex';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const url = type === 'decode' ? '/upload_decode' : '/upload_encode';

            fetch(url, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'started' && data.task_id) {
                        pollStatus(data.task_id);
                    } else {
                        alert("Start failed!");
                        hideProgress();
                    }
                })
                .catch(err => {
                    alert("Network error: " + err);
                    hideProgress();
                });
        }

        function pollStatus(taskId) {
            const interval = setInterval(() => {
                fetch('/status/' + taskId)
                    .then(r => r.json())
                    .then(data => {
                        document.getElementById('status-text').innerText = data.message;
                        document.getElementById('percent-text').innerText = data.percent + "%";
                        document.getElementById('bar-fill').style.width = data.percent + "%";

                        if (data.status === 'done') {
                            clearInterval(interval);
                            setTimeout(() => {
                                hideProgress();
                                window.location.href = data.download_url;
                            }, 1000);
                        } else if (data.status === 'error') {
                            clearInterval(interval);
                            alert("ERROR: " + data.message);
                            hideProgress();
                        }
                    });
            }, 1000);
        }

        function hideProgress() {
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('bar-fill').style.width = "0%";
            document.getElementById('percent-text').innerText = "0%";
        }
    </script>
</body>
</html>
